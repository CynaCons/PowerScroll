name: Build & Release

on:
  push:
    tags:
      - "v*"
  # Release from GitHub when the tag cannot be pushed (e.g. a cloud session
  # whose git connection refuses tag pushes): the release step creates the tag
  # on the commit this run builds.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.93.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The full Playwright campaign runs locally before tagging and independently
    # in ci.yml on main/PRs. Publishing an intentional tag only proves that the
    # committed single-file artifact can be reproduced and uploaded.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:template

      - run: npm ci --prefix powernote-mcp

      - name: Pack the agent bridge
        working-directory: powernote-mcp
        run: npm pack --pack-destination ..

      - name: Copy release artifact
        run: |
          cp dist-template/index.html PowerScroll.html
          cp dist-template/index.html PowerNote.html
          mv powerscroll-mcp-*.tgz powerscroll-mcp.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            PowerScroll.html
            PowerNote.html
            powerscroll-mcp.tgz
          generate_release_notes: true
          body: |
            ## PowerScroll ${{ inputs.tag || github.ref_name }}

            **Download `PowerScroll.html`** below — open it in a browser to start taking notes.

            No install. No account. No server. Just open and write.

            Your notes are saved inside the file itself — Ctrl+S to download your personalized copy.

            Existing PowerNote notebooks open directly. `PowerNote.html` is included as a
            byte-identical compatibility alias for notebooks updating across the rename.
