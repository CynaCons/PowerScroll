name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:template
      - name: Assemble site and live notebook
        run: |
          mkdir -p _site/app _site/assets
          cp site/index.html site/styles.css site/robots.txt site/sitemap.xml site/llms.txt _site/
          cp site/assets/* _site/assets/
          cp public/favicon.svg public/icons/icon-192.png public/icons/icon-512.png _site/assets/
          node scripts/build-pages-demo.mjs dist-template/index.html site/demo-workspace.json _site/app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
